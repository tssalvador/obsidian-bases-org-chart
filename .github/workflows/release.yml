name: Release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check the tag matches the manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$version" ]; then
            echo "Tag $TAG does not match manifest.json version $version" >&2
            exit 1
          fi
      - name: Validate and build
        run: npm run check
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "Bases Org Chart $TAG" main.js manifest.json styles.css
